name: Release Quality

on:
  workflow_dispatch:
    inputs:
      run_live_smoke:
        description: Run opt-in live Supabase smoke after migration 010 is verified
        type: boolean
        default: false
      allow_remote_db_push:
        description: Allow guarded remote Supabase db push when migration 010 is pending
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  release-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Beta preflight
        run: npm run preflight:beta

      - name: Static safety scan
        run: npm exec vitest -- run src/tests/static

      - name: Fixture smoke
        run: npm run smoke:fixtures

      - name: Unit tests
        run: npm test

      - name: Coverage
        run: npm run test:coverage

      - name: Production dependency audit
        run: npm audit --audit-level=high --omit=dev

      - name: Agent QA evidence loop
        run: npm run qa:agent:ci

      - name: Collect release evidence input
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          CORNERIQ_SMOKE_EMAIL: ${{ secrets.CORNERIQ_SMOKE_EMAIL }}
          CORNERIQ_SMOKE_PASSWORD: ${{ secrets.CORNERIQ_SMOKE_PASSWORD }}
          CORNERIQ_RUN_LIVE_SMOKE: ${{ inputs.run_live_smoke && '1' || '0' }}
          CORNERIQ_ALLOW_REMOTE_DB_PUSH: ${{ inputs.allow_remote_db_push && '1' || '0' }}
        run: node scripts/collect-release-evidence-input.mjs

      - name: Generate release evidence artifact
        run: npm run release:evidence

      - name: Upload release evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            qa-artifacts/release-evidence/current-release-evidence.md
            qa-artifacts/release-evidence/release-evidence-input.json
          if-no-files-found: warn

      - name: Release evidence assertions
        run: npm run release:quality
