name: Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production preflight
        run: npm run preflight:production

      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev

      - name: Fixture smoke
        run: npm run smoke:fixtures

      - name: Test
        run: npm test

      - name: Coverage
        run: npm run test:coverage

      - name: Select Supabase dry-run target
        id: supabase-target
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
          PRODUCTION_SUPABASE_PROJECT_REF: fohdypahnobcchfmcrrn
          DEVELOPMENT_SUPABASE_PROJECT_REF: llsmdsraunsweqmvefhj
        run: |
          set -eu
          if [ "$TARGET_BRANCH" = "main" ]; then
            target_environment="production"
            project_ref="$PRODUCTION_SUPABASE_PROJECT_REF"
          else
            target_environment="development"
            project_ref="$DEVELOPMENT_SUPABASE_PROJECT_REF"
          fi
          echo "environment=$target_environment" >> "$GITHUB_OUTPUT"
          echo "project_ref=$project_ref" >> "$GITHUB_OUTPUT"
          echo "::notice::Supabase migration dry-run will use the $target_environment project."

      - name: Supabase migration dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ steps.supabase-target.outputs.project_ref }}
          SUPABASE_TARGET_ENVIRONMENT: ${{ steps.supabase-target.outputs.environment }}
        run: |
          set -eu
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Supabase migration dry-run skipped because SUPABASE_ACCESS_TOKEN is not configured."
            exit 0
          fi
          echo "::notice::Checking migrations against the $SUPABASE_TARGET_ENVIRONMENT Supabase project."
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes
          npx supabase db push --dry-run --linked
