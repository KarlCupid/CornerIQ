name: Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production preflight
        run: npm run preflight:production

      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev

      - name: Fixture smoke
        run: npm run smoke:fixtures

      - name: Test
        run: npm test

      - name: Coverage
        run: npm run test:coverage

      - name: Supabase migration dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Supabase migration dry-run skipped because CI Supabase secrets or vars are not configured."
            exit 0
          fi
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase db push --dry-run
